<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Friend Pocket</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  body { background: var(--navy-950); min-height: 100vh; }
  .admin-login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .admin-login-card { max-width: 420px; width: 100%; }
</style>
</head>
<body data-page="admin-login">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div style="text-align:center;margin-bottom:28px;">
      <a href="index.html" class="brand" style="justify-content:center;display:inline-flex;">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 8a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v2h-1a2 2 0 0 0 0 4h1v2a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V8Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="16.4" cy="13" r="1" fill="#fff"/>
          </svg>
        </span>
        <span class="brand-name"><span>FRIEND</span><span class="sub">POCKET</span></span>
      </a>
      <p style="color:rgba(255,255,255,0.55);font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;margin-top:10px;">Admin Portal</p>
    </div>

    <div class="form-card">
      <form id="adminLoginForm" novalidate>
        <div id="loginError" style="display:none;background:#FBE9E7;color:var(--danger);padding:12px 14px;border-radius:12px;font-size:0.85rem;margin-bottom:18px;"></div>
        <div class="field" style="margin-bottom:18px;">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@friendpocket.test" required>
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <p style="text-align:right;margin-bottom:20px;"><a href="#" style="font-size:0.8rem;color:var(--gray-500);" onclick="fpToast('Password reset is not available in this demo.'); return false;">Forgot password?</a></p>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <div style="margin-top:22px;padding-top:20px;border-top:1px dashed var(--gray-100);text-align:center;">
        <p style="font-size:0.78rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px;">Preview Mode</p>
        <p style="font-size:0.85rem;color:var(--gray-700);">Username: <strong>admin@friendpocket.test</strong><br>Password: <strong>CHANGE-BEFORE-PRODUCTION</strong></p>
        <button type="button" id="fillDemoBtn" class="btn btn-outline-dark btn-sm" style="margin-top:12px;">Fill Demo Credentials</button>
        <p style="font-size:0.76rem;color:var(--gray-500);margin-top:14px;">Demo credentials are for prototype presentation only and do not represent secure production authentication.</p>
      </div>
    </div>

    <p style="text-align:center;margin-top:20px;"><a href="index.html" style="color:rgba(255,255,255,0.5);font-size:0.85rem;">&larr; Back to website</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
